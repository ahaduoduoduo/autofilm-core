services:
  autofilm-core:
    image: "${AUTOFILM_CORE_IMAGE:-ghcr.io/ahaduoduoduo/autofilm-core:latest}"
    pull_policy: always
    restart: unless-stopped
    group_add:
      - "0"
    ports:
      - "${AUTOFILM_PORT:-3100}:3100"
    environment:
      AUTOFILM_HOST: 0.0.0.0
      AUTOFILM_PORT: 3100
      AUTOFILM_DATA_DIR: /data
      AUTOFILM_PUBLIC_URL: "${AUTOFILM_PUBLIC_URL:?set AUTOFILM_PUBLIC_URL}"
      AUTOFILM_MEDIA_BASE_URL: http://autofilm-core:3100
      AUTOFILM_TELEGRAM_ADAPTER_URL: http://telegram-adapter:18012
      AUTOFILM_WECLAW_DATA_DIR: /weclaw
      AUTOFILM_WECLAW_URL: http://weclaw:18011
      AUTOFILM_WATCHLIST_INTERVAL_SECONDS: "${AUTOFILM_WATCHLIST_INTERVAL_SECONDS:-21600}"
      AUTOFILM_MASTER_KEY: "${AUTOFILM_MASTER_KEY:?set AUTOFILM_MASTER_KEY}"
    volumes:
      - ./data:/data
      - ./weclaw:/weclaw:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3100/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - autofilm

  openlist:
    image: "${AUTOFILM_OPENLIST_IMAGE:-ghcr.io/ahaduoduoduo/autofilm-openlist-restic:sha-a8bd996869f7ddf11aa96ccac85170f76d92683b}"
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${OPENLIST_PORT:-15244}:5244"
    environment:
      AUTOFILM_SERVICE_TOKEN: "${OPENLIST_JELLYFIN_TOKEN:?set OPENLIST_JELLYFIN_TOKEN}"
      AUTOFILM_JELLYFIN_URL: http://jellyfin:8096
      AUTOFILM_JELLYFIN_API_KEY: "${JELLYFIN_API_KEY:-}"
      RESTIC_ENABLE: "true"
      RESTIC_USERNAME: backrest
      RESTIC_PASSWORD: "${AUTOFILM_MASTER_KEY:?set AUTOFILM_MASTER_KEY}"
      RESTIC_TIMEZONE: Asia/Shanghai
      RESTIC_UPLOAD_MIB_PER_SECOND: "4"
      RESTIC_DAILY_UPLOAD_GIB: "80"
      RESTIC_MONTHLY_UPLOAD_GIB: "1500"
    volumes:
      - "${OPENLIST_DATA_DIR:-./data/openlist}:/opt/openlist/data"
    networks:
      - autofilm

  backrest:
    image: ghcr.io/ahaduoduoduo/backrest:sha-89b2481860750336fcfe3fb11bba1b49976714d6
    pull_policy: always
    restart: unless-stopped
    depends_on:
      - openlist
    ports:
      - "${BACKREST_PORT:-9898}:9898"
    environment:
      BACKREST_PORT: 0.0.0.0:9898
      BACKREST_DATA: /data
      BACKREST_CONFIG: /config/config.json
      BACKREST_RESTIC_COMMAND: /bin/restic
      BACKREST_OPENLIST_URL: http://openlist:5244
      BACKREST_OPENLIST_USERNAME: backrest
      BACKREST_OPENLIST_PASSWORD: "${AUTOFILM_MASTER_KEY:?set AUTOFILM_MASTER_KEY}"
      TZ: Asia/Shanghai
    volumes:
      - ./data/backrest/data:/data
      - ./data/backrest/config:/config
      - ./data/backrest/staging:/staging
      - /volume1/docker:/source/docker:ro
      - /volume1/web/HA:/source/home-assistant:ro
      - /volume2/TimeMachine:/source/time-machine:ro
      - /usr/syno/etc/certificate:/source/dsm-certificates:ro
    networks:
      - autofilm

  jellyfin:
    image: "${AUTOFILM_JELLYFIN_IMAGE:-ghcr.io/ahaduoduoduo/autofilm-jellyfin:latest}"
    pull_policy: always
    restart: unless-stopped
    depends_on:
      - openlist
    ports:
      - "${JELLYFIN_PORT:-18096}:8096"
    environment:
      AUTOFILM_OPENLIST_URL: http://openlist:5244
      AUTOFILM_OPENLIST_PUBLIC_URL: "${OPENLIST_PUBLIC_URL:?set OPENLIST_PUBLIC_URL}"
      AUTOFILM_OPENLIST_TOKEN: "${OPENLIST_JELLYFIN_TOKEN:?set OPENLIST_JELLYFIN_TOKEN}"
      AUTOFILM_REMOTE_PROBE_INTERVAL_SECONDS: 30
      AUTOFILM_REMOTE_REFRESH_MAX_DIRECTORIES: 64
      AUTOFILM_REMOTE_REFRESH_MAX_OBJECTS: 5000
    volumes:
      - "${JELLYFIN_CONFIG_DIR:-./data/jellyfin/config}:/config"
      - "${JELLYFIN_CACHE_DIR:-./data/jellyfin/cache}:/cache"
      - "${JELLYFIN_MEDIA_DIR:-./data/media}:/movie"
    networks:
      - autofilm

  weclaw:
    profiles:
      - wechat
    image: "${AUTOFILM_WECLAW_IMAGE:-ghcr.io/ahaduoduoduo/weclaw:latest}"
    pull_policy: always
    restart: unless-stopped
    depends_on:
      autofilm-core:
        condition: service_healthy
    command:
      - start
      - --foreground
    ports:
      - "${WECLAW_PORT:-18011}:18011"
    volumes:
      - ./weclaw:/root/.weclaw
    networks:
      - autofilm

  telegram-adapter:
    image: "${AUTOFILM_TELEGRAM_IMAGE:-ghcr.io/ahaduoduoduo/autofilm-telegram-adapter:latest}"
    pull_policy: always
    restart: unless-stopped
    depends_on:
      autofilm-core:
        condition: service_healthy
    environment:
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_CORE_URL: http://autofilm-core:3100
      TELEGRAM_CORE_TOKEN: "${TELEGRAM_CORE_TOKEN:-}"
      TELEGRAM_OUTBOUND_TOKEN: "${TELEGRAM_OUTBOUND_TOKEN:-}"
      TELEGRAM_PROVIDER_INSTANCE_ID: "${TELEGRAM_PROVIDER_INSTANCE_ID:-telegram-main}"
      TELEGRAM_DATA_DIR: /data
    volumes:
      - telegram-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:18012/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - autofilm

  jackett:
    profiles:
      - search
    image: lscr.io/linuxserver/jackett:latest
    restart: unless-stopped
    volumes:
      - ./data/jackett:/config
    networks:
      - autofilm

  flaresolverr:
    profiles:
      - search
    image: ghcr.io/flaresolverr/flaresolverr:latest
    restart: unless-stopped
    networks:
      - autofilm

networks:
  autofilm:
    name: autofilm

volumes:
  telegram-data:
